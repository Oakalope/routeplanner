<html xmlns:th="http://www.thymeleaf.org" lang="en-GB">
<head>
  <meta charset="UTF-8">
  <title>Journey Planner</title>
  <link href="/css/bootstrap.css/" rel="stylesheet">
  <style>
    ul {
      list-style-type: none;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #333;
    }
    li{
      float: left;
    }
    li a {
      display: block;
      color: white;
      text-align: center;
      padding: 14px 16px;
      text-decoration: none;
    }
    li a:hover {
      background-color: #111;
    }
    p{
      color: lightslategray;
      font-size: 20px;
    }
    .outer{
      border-style: solid;
      border-color: black;
      padding: 10px;
      margin: 40px;
      font-family: "Tahoma", sans-serif;
    }
  </style>
<body>
<div class="outer">
  <ul>
    <li><a href="http://localhost:8080">Home</a></li>
    <li><a href="http://localhost:8080/journeyplanner/">Plan</a></li>
  </ul>
  <!--/*@thymesVar id="planModel" type=""*/-->
  <div class="container" th:object="${planModel}">
    <p>Print of quickest route</p>
    <p>Origin: <span th:text="*{originStation}"></span></p>
    <p>Destination: <span th:text="*{destinationStation}"></span></p>
    <p>Time taken: <span th:text="*{fastestTime}"></span></p>
    <p>Route: <span th:text ="*{getRoute()}"></span></p>
  </div>
</div>
</body>
</html>
