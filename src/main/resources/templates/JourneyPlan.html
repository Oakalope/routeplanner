<html xmlns:th="http://www.thymeleaf.org" lang="en-GB">
<head>
    <meta charset="UTF-8">
    <title>Journey Planner</title>
    <link href="/css/bootstrap.css/" rel="stylesheet">
</head>
<body>
<style>
    ul {
        list-style-type: none;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background-color: #333;
    }
    li{
        float: left;
    }
    li a {
        display: block;
        color: white;
        text-align: center;
        padding: 14px 16px;
        text-decoration: none;
    }
    li a:hover {
        background-color: #111;
    }
    p{
        padding: 5px;
        color: lightslategray;
        font-size: 10px;
    }
    .outer{
        border-style: solid;
        border-color: black;
        padding: 10px;
        margin: 40px;
        font-family: "Tahoma", sans-serif;
    }
</style>
<div class="outer">
    <ul>
        <li><a href="http://localhost:8080">Home</a></li>
        <li><a href="http://localhost:8080/journeyplanner/">Plan</a></li>
    </ul>
    <div class="container my-5">
        <form action="" method="post" th:action="@{processPlan}" th:object="${planModel}">
            <div class="mb-3">
                <label for="inputOriginStation" class="form-label">Origin Station</label>
                <input th:field="*{originStation}" type="text" class="form-control"
                       id="inputOriginStation" aria-describedby="originhelp">
                <div class="container my-2"><p class="alert alert-danger"
                                               th:if="${#fields.hasErrors('originStation')}"
                                               th:errors="*{originStation}">
                    Please enter a valid station name.</p></div>
            </div>
            <div class ="mb-3">
                <label for="inputDestinationStation" class="form-label">Destination Station</label>
                <input th:field="*{destinationStation}" type="text" class="form-control"
                       id="inputDestinationStation">
                <div class="container my-2"><p class="alert alert-danger"
                                               th:if="${#fields.hasErrors('destinationStation')}"
                                               th:errors="*{destinationStation}">
                    Please enter a valid station name.</p></div>
            </div>
            <div class ="mb-3">
                <label for="inputDepartureTime" class="form-label">Departure Time</label>
                <input th:field="*{inputDepartureTime}" type="text" class="form-control"
                       id="inputDepartureTime">
                <div class="container my-2"><p class="alert alert-danger"
                                               th:if="${#fields.hasErrors('inputDepartureTime')}"
                                               th:errors="*{inputDepartureTime}">
                    Please enter a time.</p></div>
            </div>
        <button type="submit" class="btn btn-primary">Plan</button>
        </form>
    </div>
    </div>
    </body>
</html>
